name: Release

# One tag per distribution, so a package can be released on its own:
#
#   agim-v0.0.2            backend/agim
#   zett-weixin-v0.0.2     backend/zett-weixin
#   zettelekasten-v0.0.2   backend, the application itself
#
# A tag has to match the version in that project's pyproject.toml. A manual run
# builds without publishing, which is the rehearsal.
on:
  push:
    tags:
      - "agim-v*"
      - "zett-weixin-v*"
      - "zettelekasten-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Read the released package from the tag
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          name=""
          path=""
          case "$GITHUB_REF_NAME" in
            agim-v*) name=agim; path=backend/agim ;;
            zett-weixin-v*) name=zett-weixin; path=backend/zett-weixin ;;
            zettelekasten-v*) name=zettelekasten; path=backend ;;
            *)
              echo "::error::tag $GITHUB_REF_NAME does not name a package"
              exit 1
              ;;
          esac
          version="${GITHUB_REF_NAME#"$name-v"}"
          project=$(python3 -c "import tomllib; print(tomllib.load(open('$path/pyproject.toml','rb'))['project']['version'])")
          if [ "$version" != "$project" ]; then
            echo "::error::$GITHUB_REF_NAME does not match $path version $project"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches $name $version"
          {
            echo "name=$name"
            echo "path=$path"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      # Only the application embeds the compiled interface, so only its release
      # pays for the frontend build.
      - name: Build the interface
        if: steps.tag.outputs.name == 'zettelekasten'
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run build

      - name: Build the released package
        if: steps.tag.outputs.name != ''
        run: |
          uv build \
            --directory "${{ steps.tag.outputs.path }}" \
            --out-dir "$GITHUB_WORKSPACE/dist/${{ steps.tag.outputs.name }}"

      # A manual run has no tag to name a package, so it rehearses all three.
      - name: Build every package
        if: steps.tag.outputs.name == ''
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run build
          uv build --directory backend/agim --out-dir "$GITHUB_WORKSPACE/dist/agim"
          uv build --directory backend/zett-weixin --out-dir "$GITHUB_WORKSPACE/dist/zett-weixin"
          uv build --directory backend --out-dir "$GITHUB_WORKSPACE/dist/zettelekasten"

      # PyPI refuses an install whose exact pins are missing, so this fails
      # before publishing instead of after.
      - name: Check the pinned dependencies are on PyPI
        if: steps.tag.outputs.name != ''
        run: python3 .github/scripts/check_release_pins.py dist/"${{ steps.tag.outputs.name }}"/*

      - name: Check distribution metadata
        run: uv run --no-project --with twine twine check dist/*/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.build.outputs.name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # An empty token falls back to PyPI Trusted Publishing, which the
      # `id-token: write` above already allows.
      - name: Publish ${{ needs.build.outputs.name }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ needs.build.outputs.name }}
          password: ${{ secrets.PYPI_API_TOKEN }}

  release:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*/* --generate-notes --title "$GITHUB_REF_NAME"
