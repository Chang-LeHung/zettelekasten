name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - README.md
      - backend/agim/README.md
      - backend/zett-weixin/README.md
      - docs/**
      - web/**
      - .github/workflows/docs.yml
  workflow_dispatch:

# Only the deploy job needs to write; nothing here reads a secret.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Build the landing page and the documentation
        # The landing page owns the site root and the documentation lives under
        # /docs/. Both come from web/: the pages are rendered from the Markdown
        # sources by our own builder, so the published site cannot drift from
        # the READMEs and nothing generated is committed. --base is required
        # because Pages serves this repository as a project site.
        run: |
          uv sync --directory backend --locked --group dev
          uv run --project backend --no-sync python web/tools/build_docs.py --base /zettelekasten/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
