name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - README.md
      - backend/agim/README.md
      - backend/zett-weixin/README.md
      - docs/**
      - web/**
      - .github/workflows/docs.yml
  workflow_dispatch:

# Only the deploy job needs to write; nothing here reads a secret.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install the documentation toolchain
        run: npm ci --prefix docs

      - name: Build the landing page and the documentation
        # The landing page owns the site root and the documentation lives under
        # /docs/. VitePress renders the pages straight from docs/*.md, so the
        # published site cannot drift from the Markdown sources. SITE_BASE is
        # required because Pages serves this repository as a project site.
        run: make site SITE_BASE=/zettelekasten/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
