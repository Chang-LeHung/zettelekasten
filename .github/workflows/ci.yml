name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync the application environment
        run: uv sync --directory backend --locked --group dev

      - name: Check the application
        shell: bash
        run: |
          uv run --directory backend --no-sync ruff format --check zett
          uv run --directory backend --no-sync ruff check zett
          uv run --directory backend --no-sync pytest -q

      - name: Sync agim
        run: uv sync --directory backend/agim --locked --group dev

      - name: Check agim
        shell: bash
        run: |
          uv run --directory backend/agim --no-sync ruff format --check src tests
          uv run --directory backend/agim --no-sync ruff check src tests
          uv run --directory backend/agim --no-sync pytest -q

      - name: Sync zett-weixin
        run: uv sync --directory backend/zett-weixin --locked --group dev

      - name: Check zett-weixin
        shell: bash
        run: |
          uv run --directory backend/zett-weixin --no-sync ruff format --check src tests
          uv run --directory backend/zett-weixin --no-sync ruff check src tests
          uv run --directory backend/zett-weixin --no-sync pytest -q

  frontend:
    name: Frontend · Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run tests
        run: npm --prefix frontend run test

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Build
        run: npm --prefix frontend run build
