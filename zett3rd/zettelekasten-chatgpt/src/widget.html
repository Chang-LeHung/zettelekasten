<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { font: 14px/1.5 system-ui, sans-serif; color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; color: var(--color-text-primary, inherit); }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    h1 { font-size: 1.1rem; margin: 0; }
    button, input, textarea { font: inherit; }
    button { border: 1px solid var(--color-border-primary, #8886); border-radius: 8px; padding: 6px 12px; cursor: pointer; background: transparent; color: inherit; }
    button.primary { background: #397256; border-color: #397256; color: white; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .badges { display: flex; flex-wrap: wrap; gap: 5px; margin: 9px 0; }
    .badges span { border-radius: 12px; background: #8882; padding: 2px 8px; font-size: .85rem; }
    .summary { opacity: .8; }
    .preview { white-space: pre-wrap; overflow-wrap: anywhere; }
    body:not(.expanded) .preview { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    body.expanded .preview { max-height: 70vh; overflow: auto; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    label { display: block; margin: 12px 0; font-size: .88rem; }
    input, textarea { display: block; width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #8887; border-radius: 6px; background: transparent; color: inherit; }
    textarea { min-height: 160px; resize: vertical; }
    .error { color: #b33d36; white-space: pre-wrap; }
    .status { font-size: .85rem; opacity: .8; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <p id="status" class="status">Loading Zettelekasten knowledge…</p>
  <p id="error" class="error" role="alert" hidden></p>
  <section id="view" hidden>
    <header><h1 id="title"></h1><span id="kind" class="status"></span></header>
    <p id="summary" class="summary"></p>
    <div id="tags" class="badges"></div>
    <article id="body" class="preview"></article>
    <div class="actions"><button id="expand" type="button">View full</button><button id="refresh" type="button">Refresh</button><button id="edit" type="button">Edit</button></div>
  </section>
  <form id="form" hidden>
    <label>Title<input name="title" required maxlength="500"></label>
    <label>Summary<input name="summary" maxlength="20000"></label>
    <label id="subtitleLabel">Subtitle<input name="subtitle" maxlength="500"></label>
    <label>Content (Markdown)<textarea name="content" required maxlength="1000000"></textarea></label>
    <label>Categories (one path per line)<textarea name="tags"></textarea></label>
    <div class="actions"><button class="primary" type="submit">Save changes</button><button id="cancel" type="button">Cancel</button></div>
  </form>
  <!-- ZETT_WIDGET_SCRIPT -->
</body>
</html>
