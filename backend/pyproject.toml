[project]
name = "zett"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "cryptography>=43,<45",
  "pydantic>=2.12,<2.13",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "zett-agent==0.2.0.dev0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zett"]

[tool.uv]
package = true

[tool.uv.sources]
zett-agent = { path = "zett-agent", editable = true }

[dependency-groups]
dev = [
  "pre-commit>=4,<5",
  "ruff>=0.11,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<2",
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["zett", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["zett"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[project.scripts]
zett = "zett.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
