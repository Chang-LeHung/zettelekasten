[project]
name = "zett"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  # Shims for the standard-library features that landed after Python 3.10.
  "async_timeout>=4,<6; python_version < '3.11'",
  "typing_extensions>=4.12,<5; python_version < '3.12'",
  "fastapi>=0.115,<1",
  "cryptography>=43,<45",
  "pydantic>=2.12,<2.13",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "tiktoken>=0.12,<1",
  "zett-agent==0.1.1",
  "croniter>=6,<7",
  "agim==0.1.0",
  "zett-weixin==0.1.0",
  "qrcode>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zett"]
exclude = ["zett/tests"]

[tool.uv]
package = true

[tool.uv.sources]
agim = { path = "agim", editable = true }
zett-weixin = { path = "zett-weixin", editable = true }

[dependency-groups]
dev = [
  "pre-commit>=4,<5",
  "ruff>=0.11,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<2",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["zett"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[project.scripts]
zett = "zett.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["zett/tests"]
asyncio_mode = "auto"
