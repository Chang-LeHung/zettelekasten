[project]
name = "zett"
version = "0.1.0"
description = "A local-first, AI-assisted workspace for turning fleeting thoughts, conversations, links, and assets into reusable knowledge"
requires-python = ">=3.10"
dynamic = ["readme"]
license = { text = "MIT" }
keywords = ["zettelkasten", "knowledge-management", "note-taking", "local-first", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
  # Shims for the standard-library features that landed after Python 3.10.
  "async_timeout>=4,<6; python_version < '3.11'",
  "typing_extensions>=4.12,<5; python_version < '3.12'",
  # Windows ships no IANA time zone database, so zoneinfo needs the package.
  "tzdata>=2025.2,<2027; sys_platform == 'win32'",
  "fastapi>=0.115,<1",
  "cryptography>=43,<45",
  "pydantic>=2.12,<2.13",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "tiktoken>=0.12,<1",
  "zett-agent==0.1.3",
  "croniter>=6,<7",
  "agim==0.1.0",
  "zett-weixin==0.1.0",
  "qrcode>=8,<9",
]

[project.urls]
Homepage = "https://chang-lehung.github.io/zettelekasten/"
Documentation = "https://chang-lehung.github.io/zettelekasten/docs/"
Repository = "https://github.com/Chang-LeHung/zettelekasten"
Issues = "https://github.com/Chang-LeHung/zettelekasten/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The repository README is the product page users see on PyPI; hatchling only
# accepts a readme inside the project directory, so a metadata hook inlines it.
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["zett"]
exclude = ["zett/tests"]

[tool.uv]
package = true

[tool.uv.sources]
agim = { path = "agim", editable = true }
zett-weixin = { path = "zett-weixin", editable = true }

[dependency-groups]
dev = [
  "pre-commit>=4,<5",
  "ruff>=0.11,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<2",
  # The documentation builder in web/tools/build_docs.py runs from this
  # environment, so the editors and CI resolve its imports like any other tool.
  "markdown>=3.7,<4",
  "pymdown-extensions>=10.14,<11",
  "pygments>=2.18,<3",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["zett"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[project.scripts]
zett = "zett.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["zett/tests"]
asyncio_mode = "auto"
