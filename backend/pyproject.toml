[project]
name = "knowledge-cards"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.12,<2.13",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
  "cryptography>=43,<44",
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.2,<2",
  "langchain-anthropic>=0.3,<1",
  "langchain-google-genai>=2,<3",
  "langchain-ollama>=0.2,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[dependency-groups]
dev = [
  "ruff>=0.11,<1",
  "pytest>=8,<9",
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[project.scripts]
cards = "app.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
