minimum_pre_commit_version: "4.0.0"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff checks
        entry: make ruff-check
        language: system
        always_run: true
        pass_filenames: false

      - id: frontend-typecheck
        name: Frontend TypeScript check
        entry: make typecheck
        language: system
        always_run: true
        pass_filenames: false
